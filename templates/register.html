<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
</head>

<body>
    <div class="container">
        
        <form method="POST" action="{{ url_for('register') }}">
            
            <h1> Create an account</h1>
            
            <h6> Already have an account? <a href="{{ url_for('login') }}"> Log in</a></h6>
            
            <input type="text" placeholder="First Name" name="first_name" required>
            <input type="text" placeholder="Last Name" name="last_name" required>
            <br><br>
            <input type="email" placeholder="Email" name="email" required style="width: 340px">
            <br><br>
            <input type="password" placeholder="Enter your password" name="password" required style="width: 340px">
            <br><br>
            <label>
                <input type="checkbox" name="terms" required>
                Agree to the <a href="#">Terms and Conditions</a>
                <br>
                <br>
                <button type="submit"> Create Account</button>
            </label>
        </form>

        <div class="image-side">
            <img src="{{ url_for('static', filename='galaxy.jpg') }}" alt="Register">
        </div>

    </div>
</body>
</html>
